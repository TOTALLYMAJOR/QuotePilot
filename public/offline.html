<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4ef" />
    <title>Connection needed | QuotePilot</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f6f4;
        color: #1f2023;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(20px, 6vw, 72px);
        background: #f6f6f4;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid #e4e4e0;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(31, 32, 35, 0.08);
      }

      img { width: 52px; height: 52px; display: block; margin-bottom: 32px; }

      .eyebrow {
        margin: 0 0 10px;
        color: #6b6e74;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 12ch;
        font-family: "Bodoni Moda", Georgia, serif;
        font-size: clamp(2.25rem, 9vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 0.98;
      }

      .summary {
        margin: 24px 0 0;
        max-width: 52ch;
        color: #3b3d42;
        font-size: clamp(1rem, 2.5vw, 1.125rem);
        line-height: 1.65;
      }

      .boundary {
        margin: 24px 0 0;
        padding: 14px 16px;
        border-left: 3px solid #8d611a;
        background: #f4f4f2;
        color: #3b3d42;
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      a {
        min-height: 48px;
        width: fit-content;
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border: 1px solid #8d611a;
        border-radius: 8px;
        background: #8d611a;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover { background: #704b12; border-color: #704b12; }
      a:focus-visible { outline: 3px solid rgba(141, 97, 26, 0.4); outline-offset: 3px; }

      @media (max-width: 480px) {
        body { padding: 16px; }
        main { padding: 28px 24px; }
        a { width: 100%; }
      }

      @media (forced-colors: active) {
        main, .boundary, a { border: 1px solid CanvasText; }
        a { background: ButtonFace; color: ButtonText; }
      }
    </style>
  </head>
  <body>
    <main data-pwa-offline-shell="safe-recovery-v1" aria-labelledby="offline-title">
      <img src="/brand/quotepilot-mark.svg" alt="QuotePilot" width="52" height="52" />
      <p class="eyebrow">Connection needed</p>
      <h1 id="offline-title">QuotePilot is offline</h1>
      <p class="summary">
        Reconnect before reviewing quotes, payments, customer messages, or event operations. QuotePilot cannot verify that work while this device is offline.
      </p>
      <p class="boundary" role="status">Nothing was sent, saved, or changed.</p>
      <a href="/">Try QuotePilot again</a>
    </main>
  </body>
</html>
