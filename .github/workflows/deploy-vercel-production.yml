name: Deploy Vercel Production
run-name: deploy/v1/vercel/${{ inputs.release_sha }}/${{ inputs.ci_run_id }}/${{ inputs.uat_run_id }}/${{ inputs.rollback_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full tagged main commit SHA to deploy
        required: true
        type: string
      ci_run_id:
        description: Successful main-push CI Quality run id for release_sha
        required: true
        type: string
      uat_run_id:
        description: Successful Release UAT Attestation run id for release_sha
        required: true
        type: string
      rollback_sha:
        description: Full Vercel rollback commit SHA
        required: true
        type: string

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

jobs:
  deploy_vercel:
    name: Build + Deploy Vercel
    if: github.ref == 'refs/heads/main' && github.sha == inputs.release_sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_UAT_ATTESTER_IDS: ${{ vars.RELEASE_UAT_ATTESTER_IDS }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION || 'us-central1' }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact-SHA release evidence before dependency execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          UAT_RUN_ID: ${{ inputs.uat_run_id }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          node ./scripts/production-release-evidence.mjs \
            --release-sha "${RELEASE_SHA}" \
            --ci-run-id "${CI_RUN_ID}" \
            --uat-run-id "${UAT_RUN_ID}" \
            --rollback-sha "${ROLLBACK_SHA}" \
            --target vercel

      - name: Install dependencies
        run: npm ci

      - name: Materialize the approved Vercel project link
        run: |
          mkdir -p .vercel
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".vercel/project.json", JSON.stringify({ projectId: "prj_epLi14LmBItwYkv25XZoAkWZf4Jk", orgId: "team_AW2QNNgYt5vESEO3eOTJXHp1", projectName: "quoteflow" }));'

      - name: Verify evidence and deploy to Vercel
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          UAT_RUN_ID: ${{ inputs.uat_run_id }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node ./scripts/deploy-vercel-production.mjs \
            --confirm "DEPLOY quotepilot.mbmapps.com via vercel" \
            --release-sha "${RELEASE_SHA}" \
            --ci-run-id "${CI_RUN_ID}" \
            --uat-run-id "${UAT_RUN_ID}" \
            --rollback-sha "${ROLLBACK_SHA}"
