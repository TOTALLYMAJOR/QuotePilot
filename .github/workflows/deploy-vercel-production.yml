name: Deploy Vercel Production
run-name: deploy/v1/${{ vars.RELEASE_APPROVAL_MODE || 'independent-review' }}/vercel/${{ inputs.release_sha }}/${{ inputs.ci_run_id }}/${{ inputs.rollback_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full tagged main commit SHA to deploy
        required: true
        type: string
      ci_run_id:
        description: Successful main-push CI Quality run id for release_sha
        required: true
        type: string
      rollback_sha:
        description: Full Vercel rollback commit SHA
        required: true
        type: string
      confirmation:
        description: DEPLOY quotepilot.mbmapps.com via vercel
        required: true
        type: string

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

jobs:
  deploy_vercel:
    name: Verify + Deploy Vercel
    if: github.ref == 'refs/heads/main' && github.sha == inputs.release_sha && inputs.confirmation == 'DEPLOY quotepilot.mbmapps.com via vercel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.RELEASE_APPROVAL_MODE == 'solo-operator' && 'production-solo' || 'production' }}
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_APPROVAL_MODE: ${{ vars.RELEASE_APPROVAL_MODE || 'independent-review' }}
      RELEASE_SOLO_OPERATOR_IDS: ${{ vars.RELEASE_SOLO_OPERATOR_IDS }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION || 'us-central1' }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tagged-main CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          node ./scripts/verify-direct-production-release.mjs \
            --release-sha "${RELEASE_SHA}" \
            --ci-run-id "${CI_RUN_ID}" \
            --rollback-sha "${ROLLBACK_SHA}" \
            --target vercel

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize approved Vercel project link
        run: |
          mkdir -p .vercel
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(".vercel/project.json", JSON.stringify({ projectId: "prj_epLi14LmBItwYkv25XZoAkWZf4Jk", orgId: "team_AW2QNNgYt5vESEO3eOTJXHp1", projectName: "quoteflow" }));'

      - name: Build and deploy exact release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_APP_URL: ${{ vars.APP_BASE_URL }}
          VITE_APP_HOST: quotepilot.mbmapps.com
          VITE_BASE_DOMAIN: ${{ vars.APP_BASE_DOMAIN }}
          VITE_DEFAULT_ORGANIZATION_ID: ${{ vars.VITE_DEFAULT_ORGANIZATION_ID }}
          VITE_CUSTOMER_CENTERED_WORKSPACE_ENABLED: "true"
          VITE_PILOT_NOW_ENABLED: "true"
          VITE_PILOT_EVENT_ROOM_ENABLED: "true"
          VITE_PILOT_GUIDED_SELLING_ENABLED: "true"
          VITE_PILOT_CREATE_ENABLED: "true"
          VITE_PILOT_CHANGE_REQUESTS_ENABLED: "true"
          VITE_PILOT_COMMAND_ENABLED: "true"
          VITE_PILOT_MARGINS_ENABLED: "true"
          VITE_PILOT_DECISION_ROOM_ENABLED: "true"
          VITE_AMBIENT_UI_ENABLED: "true"
          VITE_OPERATIONAL_STAFFING_ENABLED: "true"
          VITE_BUYER_ACCESS_ENABLED: "true"
          VITE_BUYER_ACCESS_PUBLIC_CTA_ENABLED: "true"
          VITE_BUYER_ACCESS_TURNSTILE_SITE_KEY: ${{ vars.VITE_BUYER_ACCESS_TURNSTILE_SITE_KEY }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          node ./scripts/deploy-vercel-production.mjs \
            --confirm "${{ inputs.confirmation }}" \
            --release-sha "${RELEASE_SHA}" \
            --ci-run-id "${CI_RUN_ID}" \
            --rollback-sha "${ROLLBACK_SHA}"

      - name: Verify public production edge
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://quotepilot.mbmapps.com/ >/dev/null

      - name: Record deployment
        run: |
          {
            echo "### Vercel production deployed"
            echo "- Release SHA: ${{ inputs.release_sha }}"
            echo "- CI run: ${{ inputs.ci_run_id }}"
            echo "- Rollback SHA: ${{ inputs.rollback_sha }}"
            echo "- Public edge responded successfully."
          } >> "${GITHUB_STEP_SUMMARY}"
