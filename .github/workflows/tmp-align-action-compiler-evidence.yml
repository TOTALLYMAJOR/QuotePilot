name: Temporary Align Configured Action Compiler Evidence

on:
  push:
    branches:
      - feat/configured-quote-action-state
    paths:
      - .github/workflows/tmp-align-action-compiler-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/configured-quote-action-state
          fetch-depth: 0
      - name: Align compiler to authoritative evidence prerequisites
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const workflowPath = '.github/workflows/tmp-align-action-compiler-evidence.yml';
          const read = (path) => fs.readFileSync(path, 'utf8');
          const write = (path, content) => fs.writeFileSync(path, content.endsWith('\n') ? content : `${content}\n`);
          function replaceOnce(source, before, after, label) {
            const index = source.indexOf(before);
            if (index < 0) throw new Error(`Missing anchor: ${label}`);
            if (source.indexOf(before, index + before.length) >= 0) throw new Error(`Ambiguous anchor: ${label}`);
            return source.slice(0, index) + after + source.slice(index + before.length);
          }

          {
            const path = 'src/lib/quoteActionState.js';
            let source = read(path);
            source = replaceOnce(
              source,
              '  if (["sent", "viewed"].includes(status)) {\n    return firstEnabled(actions, ["open_conversation"]);\n  }',
              '  if (["sent", "viewed"].includes(status)) {\n    return firstEnabled(actions, ["open_conversation"])\n      || firstVisible(actions, ["send_quote"]);\n  }',
              'sent-viewed delivery recovery'
            );
            source = replaceOnce(
              source,
              '  const depositStatus = normalized(quote?.payment?.depositStatus) || "unpaid";\n  const depositSettled = ["paid", "refunded"].includes(depositStatus)\n    || Boolean(text(quote?.payment?.depositConfirmedAtISO));\n  const depositAmountCents = moneyCents(quote?.totals?.deposit);\n  const contractPresent = Boolean(text(quote?.booking?.contractNumber))\n    && Boolean(text(quote?.booking?.contractConvertedAtISO));\n  const finalBalance = quote?.payment?.finalBalance || {};\n  const finalBalanceStatus = normalized(finalBalance.status) || "unpaid";\n  const derivedBalanceCents = Math.max(\n    0,\n    moneyCents(quote?.totals?.total) - moneyCents(quote?.totals?.deposit)\n  );\n  const storedBalanceCents = Number(finalBalance.amountCents);\n  const finalBalanceCents = Number.isSafeInteger(storedBalanceCents) && storedBalanceCents >= 0\n    ? storedBalanceCents\n    : derivedBalanceCents;\n  const finalBalanceDue = status === "booked"\n    && contractPresent\n    && depositSettled\n    && finalBalanceCents > 0\n    && finalBalanceStatus !== "paid";\n  const depositCheckoutState = normalized(quote?.payment?.stripeCheckoutState);\n  const depositSessionId = text(quote?.payment?.stripeSessionId);',
              '  const depositStatus = normalized(quote?.payment?.depositStatus) || "unpaid";\n  const depositConfirmedAtISO = text(quote?.payment?.depositConfirmedAtISO);\n  const depositSessionId = text(quote?.payment?.stripeSessionId);\n  const depositPaid = depositStatus === "paid"\n    && /^cs_[A-Za-z0-9_]+$/.test(depositSessionId)\n    && Boolean(depositConfirmedAtISO);\n  const depositSettled = ["paid", "refunded"].includes(depositStatus)\n    || Boolean(depositConfirmedAtISO);\n  const depositAmountCents = moneyCents(quote?.totals?.deposit);\n  const contractPresent = Boolean(text(quote?.booking?.contractNumber))\n    && Boolean(text(quote?.booking?.contractConvertedAtISO));\n  const finalBalance = quote?.payment?.finalBalance || {};\n  const finalBalanceStatus = normalized(finalBalance.status) || "unpaid";\n  const storedBalanceCents = Number(finalBalance.amountCents);\n  const finalBalanceCents = Number.isSafeInteger(storedBalanceCents) && storedBalanceCents > 0\n    ? storedBalanceCents\n    : 0;\n  const finalBalanceDue = status === "booked"\n    && contractPresent\n    && depositPaid\n    && finalBalanceCents > 0\n    && finalBalanceStatus !== "paid";\n  const depositCheckoutState = normalized(quote?.payment?.stripeCheckoutState);',
              'final balance authoritative prerequisites'
            );
            source = replaceOnce(
              source,
              '      depositSettled,\n      contractPresent,\n      finalBalanceDue,',
              '      depositSettled,\n      depositPaid,\n      contractPresent,\n      finalBalanceDue,',
              'expose paid deposit evidence'
            );
            write(path, source);
          }

          {
            const path = 'src/lib/__tests__/quoteActionState.test.js';
            let source = read(path);
            const insertion = `\n  test("does not infer final-balance eligibility from refunded or incomplete deposit evidence", () => {\n    const refunded = controller(quote("booked", {\n      payment: {\n        depositStatus: "refunded",\n        depositConfirmedAtISO: "2099-08-03T12:10:00.000Z",\n        stripeSessionId: "cs_test_refunded",\n        finalBalance: { amountCents: 75000, status: "unpaid" }\n      },\n      booking: {\n        contractNumber: "C-1",\n        contractConvertedAtISO: "2099-08-03T12:05:00.000Z"\n      },\n      workflow: { quoteDelivery: providerAcceptedDelivery() }\n    })).actionState;\n\n    const missingAmount = controller(quote("booked", {\n      payment: {\n        depositStatus: "paid",\n        depositConfirmedAtISO: "2099-08-03T12:10:00.000Z",\n        stripeSessionId: "cs_test_paid",\n        finalBalance: { status: "unpaid" }\n      },\n      booking: {\n        contractNumber: "C-1",\n        contractConvertedAtISO: "2099-08-03T12:05:00.000Z"\n      },\n      workflow: { quoteDelivery: providerAcceptedDelivery() }\n    })).actionState;\n\n    expect(refunded.state.depositPaid).toBe(false);\n    expect(refunded.state.finalBalanceDue).toBe(false);\n    expect(refunded.actions.request_balance.visible).toBe(false);\n    expect(missingAmount.state.depositPaid).toBe(true);\n    expect(missingAmount.state.finalBalanceDue).toBe(false);\n    expect(missingAmount.evidence.finalBalance.amountCents).toBe(0);\n  });\n\n  test("makes resend the next recovery for sent records missing current delivery evidence", () => {\n    const result = controller(quote("sent", {\n      workflow: { quoteDelivery: {} }\n    })).actionState;\n\n    expect(result.state.providerAccepted).toBe(false);\n    expect(result.actions.open_conversation.visible).toBe(false);\n    expect(result.primaryAction).toMatchObject({\n      id: "send_quote",\n      label: "Send proposal",\n      visible: true,\n      enabled: true\n    });\n  });\n`;
            const close = '\n});\n';
            const index = source.lastIndexOf(close);
            if (index < 0) throw new Error('Test close not found.');
            if (!source.includes('does not infer final-balance eligibility from refunded or incomplete deposit evidence')) {
              source = source.slice(0, index) + insertion + source.slice(index);
            }
            write(path, source);
          }

          {
            const path = 'CHANGELOG.md';
            let source = read(path);
            source = source.replace(
              'Existing Firebase, Stripe, portal, approval, and contract authority is unchanged;',
              'Final-balance ranking now mirrors the existing booked-contract + verified paid-deposit + stored-balance prerequisites, and sent/viewed records without current delivery evidence recover through tracked resend instead of conversation. Existing Firebase, Stripe, portal, approval, and contract authority is unchanged;'
            );
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', timeZoneName: 'short' }).formatToParts(now);
            const value = (type) => parts.find((part) => part.type === type)?.value || '';
            source = source.replace(/^Last updated: .+$/m, `Last updated: ${value('year')}-${value('month')}-${value('day')} ${value('hour')}:${value('minute')}:${value('second')} ${value('timeZoneName')}`);
            write(path, source);
          }

          fs.rmSync(workflowPath);
          NODE

          git config user.name "QuotePilot bounded migration"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/quoteActionState.js src/lib/__tests__/quoteActionState.test.js CHANGELOG.md .github/workflows/tmp-align-action-compiler-evidence.yml
          git diff --cached --check
          git commit -m "fix(quotes): align action ranking to evidence gates"
          git push origin HEAD:feat/configured-quote-action-state
