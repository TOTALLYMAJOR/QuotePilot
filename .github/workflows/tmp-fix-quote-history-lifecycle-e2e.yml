name: Temporary Align Quote History Lifecycle E2E

on:
  push:
    branches:
      - feat/configured-quote-action-state
    paths:
      - .github/workflows/tmp-fix-quote-history-lifecycle-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/configured-quote-action-state
          fetch-depth: 0
      - name: Replace obsolete lifecycle select assertion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const workflowPath = '.github/workflows/tmp-fix-quote-history-lifecycle-e2e.yml';
          const path = 'e2e/quote-wizard.smoke.spec.js';
          let source = fs.readFileSync(path, 'utf8');
          const before = '  await expect(firstQuoteRow.getByRole("combobox").first()).toHaveValue("draft");';
          const after = '  await expect(firstQuoteRow.locator(".status-chip").filter({ hasText: /^Draft$/ }).first()).toBeVisible();';
          if (!source.includes(before)) throw new Error('Obsolete draft combobox assertion not found.');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          fs.rmSync(workflowPath);
          NODE

          git config user.name "QuotePilot bounded migration"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/quote-wizard.smoke.spec.js .github/workflows/tmp-fix-quote-history-lifecycle-e2e.yml
          git diff --cached --check
          git commit -m "test(quotes): assert lifecycle evidence after status cleanup"
          git push origin HEAD:feat/configured-quote-action-state
