name: Temporary Configured Quote Migration Push Fix

on:
  push:
    branches:
      - feat/configured-quote-action-state
    paths:
      - .github/workflows/tmp-configured-quote-action-state-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/configured-quote-action-state
          fetch-depth: 0
      - name: Execute corrected governed migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = '.github/workflows/tmp-configured-quote-action-state.yml';
          const fixPath = '.github/workflows/tmp-configured-quote-action-state-fix.yml';
          const yaml = fs.readFileSync(sourcePath, 'utf8');
          const marker = '        run: |\n';
          const start = yaml.indexOf(marker);
          if (start < 0) throw new Error('Original migration run block not found.');
          const block = yaml.slice(start + marker.length)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n')
            .replace(
              "fs.rmSync(workflowPath);",
              "fs.rmSync(workflowPath);\nfs.rmSync('.github/workflows/tmp-configured-quote-action-state-fix.yml');"
            )
            .replace(
              '  .github/workflows/tmp-configured-quote-action-state.yml',
              '  .github/workflows/tmp-configured-quote-action-state.yml \\\n  .github/workflows/tmp-configured-quote-action-state-fix.yml'
            )
            .replace(
              'git push origin HEAD:${branch}',
              'git push origin HEAD:feat/configured-quote-action-state'
            );
          fs.writeFileSync('/tmp/run-configured-quote-migration.sh', block);
          NODE
          bash -euo pipefail /tmp/run-configured-quote-migration.sh
