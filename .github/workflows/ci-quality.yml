name: CI Quality

on:
  pull_request:
  push:
    branches:
      - main

env:
  VITE_FIREBASE_API_KEY: ci-test-browser-key
  VITE_FIREBASE_AUTH_DOMAIN: tonicatering.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: tonicatering
  VITE_FIREBASE_STORAGE_BUCKET: tonicatering.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
  VITE_FIREBASE_APP_ID: "1:1234567890:web:ci-test"

concurrency:
  group: ci-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: Classify Changes + Lane Plan
    runs-on: ubuntu-latest
    outputs:
      changed_count: ${{ steps.classify.outputs.changed_count }}
      changed_files_csv: ${{ steps.classify.outputs.changed_files_csv }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      high_risk: ${{ steps.classify.outputs.high_risk }}
      is_main_push: ${{ steps.classify.outputs.is_main_push }}
      run_heavy_lanes: ${{ steps.classify.outputs.run_heavy_lanes }}
      heavy_required: ${{ steps.classify.outputs.heavy_required }}
      firebase_required: ${{ steps.classify.outputs.firebase_required }}
      cwv_required: ${{ steps.classify.outputs.cwv_required }}
      change_type: ${{ steps.classify.outputs.change_type }}
      tenant_impact: ${{ steps.classify.outputs.tenant_impact }}
      recommended_lanes_csv: ${{ steps.classify.outputs.recommended_lanes_csv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Classify CI lanes
        id: classify
        run: npm run classify:ci:lanes

  lane_quick:
    name: lane:quick (Preflight + Secrets)
    runs-on: ubuntu-latest
    needs: classify_changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run lane:quick
        run: npm run lane:quick

  lane_core:
    name: lane:core (Unit + Build + Governance + Bundle)
    runs-on: ubuntu-latest
    needs: lane_quick
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lane:core
        run: npm run lane:core

  docker_build_smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    needs: lane_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker compose build web

  cwv_smoke:
    name: lane:cwv-smoke
    runs-on: ubuntu-latest
    needs:
      - classify_changes
      - lane_core
    if: needs.classify_changes.outputs.run_heavy_lanes == 'true'
    continue-on-error: ${{ needs.classify_changes.outputs.cwv_required != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser + Linux deps for Lighthouse
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium path for Lighthouse
        run: echo "CHROME_PATH=$(node -e 'const { chromium } = require(\"playwright\"); process.stdout.write(chromium.executablePath());')" >> "$GITHUB_ENV"

      - name: Run CWV smoke gate
        run: npm run check:perf:cwv
        env:
          LHCI_COLLECT__CHROME_PATH: ${{ env.CHROME_PATH }}

  playwright_smoke:
    name: lane:playwright-smoke
    runs-on: ubuntu-latest
    needs:
      - classify_changes
      - lane_core
    if: needs.classify_changes.outputs.run_heavy_lanes == 'true'
    continue-on-error: ${{ needs.classify_changes.outputs.heavy_required != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser + Linux deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  playwright_firebase_smoke:
    name: lane:firebase-auth-rules
    runs-on: ubuntu-latest
    needs:
      - classify_changes
      - lane_core
    if: needs.classify_changes.outputs.run_heavy_lanes == 'true'
    continue-on-error: ${{ needs.classify_changes.outputs.firebase_required != 'true' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser + Linux deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Firebase emulator smoke suite
        run: npm run test:e2e:firebase

      - name: Upload Playwright report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firebase-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firebase-traces
          path: test-results/
          retention-days: 14

  playwright_firebase_authoritative_smoke:
    name: lane:authoritative-pricing
    runs-on: ubuntu-latest
    needs:
      - classify_changes
      - lane_core
    if: needs.classify_changes.outputs.run_heavy_lanes == 'true'
    continue-on-error: ${{ needs.classify_changes.outputs.firebase_required != 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser + Linux deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Firebase authoritative pricing smoke suite
        run: npm run test:e2e:firebase:authoritative

      - name: Upload Playwright report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firebase-authoritative-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firebase-authoritative-traces
          path: test-results/
          retention-days: 14
