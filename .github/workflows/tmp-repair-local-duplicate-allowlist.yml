name: Temporary Repair Local Duplicate Allowlist

on:
  push:
    branches:
      - feat/configured-quote-action-state
    paths:
      - .github/workflows/tmp-repair-local-duplicate-allowlist.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/configured-quote-action-state
          fetch-depth: 0
      - name: Repair exact allowlist references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const workflowPath = '.github/workflows/tmp-repair-local-duplicate-allowlist.yml';
          const path = 'src/lib/quoteStore.js';
          let source = fs.readFileSync(path, 'utf8');
          const stale = '      ? sourceWithoutIdentity.selection.menuItemDetails.map((item) => ({';
          if (!source.includes(stale)) throw new Error('Expected stale menuItemDetails reference was not found.');
          source = source.replace(stale, '      ? sourceSelection.menuItemDetails.map((item) => ({');
          const duplicateSelection = '    status: "draft",\n    deletedAtISO: "",\n    selection,\n    payment: {';
          if (!source.includes(duplicateSelection)) throw new Error('Expected duplicate selection property was not found.');
          source = source.replace(duplicateSelection, '    status: "draft",\n    deletedAtISO: "",\n    payment: {');
          fs.writeFileSync(path, source);
          fs.rmSync(workflowPath);
          NODE

          git config user.name "QuotePilot bounded migration"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/quoteStore.js .github/workflows/tmp-repair-local-duplicate-allowlist.yml
          git diff --cached --check
          git commit -m "fix(quotes): repair local duplicate allowlist references"
          git push origin HEAD:feat/configured-quote-action-state
