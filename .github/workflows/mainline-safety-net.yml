name: Mainline Safety Net (Recovery PR for Failed Pushes)

on:
  workflow_run:
    workflows:
      - CI Quality
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: mainline-safety-net-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  open_recovery_pr_for_failed_main_push:
    name: Open Recovery PR for Failed Main Push
    if: >
      github.event.workflow_run.name == 'CI Quality' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'success' &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(main-guard): auto-revert')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare recovery branch (when failed commit is still main head)
        id: recovery
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags

          current_head="$(git rev-parse origin/main)"
          echo "Failed SHA: ${FAILED_SHA}"
          echo "Current main HEAD: ${current_head}"

          if [ "${current_head}" != "${FAILED_SHA}" ]; then
            echo "main advanced after the failed run; skipping recovery PR."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          recovery_branch="automation/main-guard-revert-${FAILED_SHA}"
          git switch -c "${recovery_branch}"

          parent_count="$(git rev-list --parents -n 1 "${FAILED_SHA}" | wc -w | tr -d ' ')"
          if [ "${parent_count}" -gt 2 ]; then
            git revert -m 1 --no-commit "${FAILED_SHA}"
          else
            git revert --no-commit "${FAILED_SHA}"
          fi

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes detected after revert; nothing to commit."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --cached --check
          git commit -m "chore(main-guard): auto-revert ${FAILED_SHA} after CI Quality failure"
          git push origin "HEAD:refs/heads/${recovery_branch}"
          echo "created=true" >> "${GITHUB_OUTPUT}"
          echo "recovery_branch=${recovery_branch}" >> "${GITHUB_OUTPUT}"

      - name: Open recovery PR and dispatch its CI
        id: pull_request
        if: steps.recovery.outputs.created == 'true'
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_BRANCH: ${{ steps.recovery.outputs.recovery_branch }}
        run: |
          set -euo pipefail

          pr_url="$(gh pr list \
            --state open \
            --head "${RECOVERY_BRANCH}" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -z "${pr_url}" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "${RECOVERY_BRANCH}" \
              --title "chore(main-guard): recover failed main ${FAILED_SHA}" \
              --body "CI Quality failed for current main commit ${FAILED_SHA}. This PR contains only the generated revert. Review and merge it after the dispatched CI Quality run passes; production promotion remains blocked independently.")"
          fi

          gh workflow run ci-quality.yml --ref "${RECOVERY_BRANCH}"
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
          echo "Recovery PR: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CI Quality was dispatched against ${RECOVERY_BRANCH}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Emit summary
        run: echo "Mainline recovery-PR safety net completed."
